jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./startbootstrap-agency

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to live folder
        run: |
          mkdir -p ~/live-site
          cp -r dist/* ~/live-site
